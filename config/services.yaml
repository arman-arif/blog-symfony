# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.media.public_base_url: '/uploads/media'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\Settings\SettingsServiceInterface: '@App\Service\Settings\DefaultSettingsService'
    App\Service\Media\MediaStorageInterface: '@App\Service\Media\FlysystemMediaStorage'
    App\Service\Comment\SpamCheckerInterface: '@App\Service\Comment\NullSpamChecker'

    # A runtime-selected adapter needs a factory; cache pools replace the namespace argument.
    app.optional_redis_adapter:
        class: Symfony\Component\Cache\Adapter\AdapterInterface
        factory: ['@App\Infrastructure\Cache\OptionalRedisCacheFactory', 'create']
        arguments: ['fieldnotes', 600]

when@test:
    services:
        App\Tests\Factory\:
            resource: '%kernel.project_dir%/tests/Factory/'
            autowire: true
            autoconfigure: true
        App\Tests\Support\:
            resource: '%kernel.project_dir%/tests/Support/'
            autowire: true
            autoconfigure: true
        App\Tests\Support\InMemorySettingsService:
            public: true
        App\Service\Settings\SettingsServiceInterface: '@App\Tests\Support\InMemorySettingsService'
