liip_imagine:
    driver: gd
    twig:
        mode: lazy
    data_loader: media_loader
    cache: media_cache
    loaders:
        media_loader:
            flysystem:
                filesystem_service: media.storage
    resolvers:
        media_cache:
            flysystem:
                filesystem_service: media.cache.storage
                cache_prefix: ''
                root_url: '/uploads/media/cache'
    filter_sets:
        thumbnail:
            quality: 80
            filters:
                thumbnail: { size: [320, 320], mode: outbound }
        medium:
            quality: 85
            filters:
                thumbnail: { size: [800, 800], mode: outbound }
        large:
            quality: 85
            filters:
                thumbnail: { size: [1600, 1600], mode: outbound }
        webp:
            quality: 80
            format: webp
            filters:
                thumbnail: { size: [1200, 1200], mode: outbound }
