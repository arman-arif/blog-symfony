<VirtualHost *:80>
    ServerName journal.example.com
    DocumentRoot /var/www/fieldnotes/public

    <Directory /var/www/fieldnotes/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/fieldnotes.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/fieldnotes/public/uploads>
        Options -ExecCGI -Indexes
        <FilesMatch "\.(php|phtml|phar|php[0-9])$">
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/fieldnotes-error.log
    CustomLog ${APACHE_LOG_DIR}/fieldnotes-access.log combined
</VirtualHost>

