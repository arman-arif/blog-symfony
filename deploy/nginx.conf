server {
    listen 80;
    listen [::]:80;
    server_name journal.example.com;

    root /var/www/fieldnotes/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12m;
    server_tokens off;

    # Symfony front controller only.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Uploaded media is public data, never executable code.
    location ^~ /uploads/ {
        try_files $uri =404;
        location ~* \.(php|phtml|phar|php[0-9])$ {
            deny all;
        }
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|gif|ico|woff2?|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # TLS: configure certificates after verifying HTTP, then enable the block.
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/journal.example.com.pem;
    # ssl_certificate_key /etc/ssl/private/journal.example.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/fieldnotes.access.log;
    error_log  /var/log/nginx/fieldnotes.error.log;
}
